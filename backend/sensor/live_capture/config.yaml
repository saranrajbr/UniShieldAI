# UniShield live capture sensor configuration
backend:
  url: "http://localhost:8000"
  post_path: "/api/v1/traffic/flows"
  timeout_sec: 5

source:
  # Choose one of: zeek, scapy, test
  mode: "test"
  interface: null
  pcap_file: null
  zeek:
    log_dir: "logs/zeek"
    log_type: "conn.log"
  scapy:
    sniff_timeout_sec: 10
    batch_size: 500

delivery:
  batch_size: 100
  flush_interval_sec: 1.0
  max_retries: 3

logging:
  level: "INFO"
